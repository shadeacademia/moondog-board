<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Dog — the table</title>
<style>
  :root {
    --bg: #14110e;
    --bg-2: #1c1713;
    --card: #241c16;
    --card-2: #2c231c;
    --ink: #f4efe6;
    --muted: #b3a696;
    --faint: #7d7268;
    --line: #3d332b;
    --amber: #e2a45c;
    --amber-2: #f0d7b0;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    --serif: "Droid Serif", "DejaVu Serif", Georgia, serif;
    --sans: "DejaVu Sans", "Droid Sans", sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 10% -10%, #3a2a1c 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #243024 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }

  .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

  header.top {
    padding: 36px 0 8px;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: end;
    flex-wrap: wrap;
  }
  .eyebrow {
    margin: 0 0 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--amber);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(40px, 6vw, 68px);
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  .lede {
    margin: 12px 0 0;
    max-width: 46ch;
    color: var(--muted);
    line-height: 1.5;
  }
  .stats {
    display: flex;
    gap: 18px;
    color: var(--faint);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .stats strong { color: var(--ink); font-weight: 600; display: block; font-size: 22px; letter-spacing: 0; text-transform: none; font-family: var(--serif); }

  nav.jump {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 22px 0 6px;
  }
  nav.jump a {
    text-decoration: none;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--amber-2);
  }
  nav.jump a:hover, nav.jump a:focus-visible { border-color: var(--amber); outline: none; }

  .board {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
    padding: 18px 0 64px;
  }
  .dish { grid-column: span 4; }
  .dish.wide { grid-column: span 6; }

  .dish {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .frame { position: relative; background: #0d0b09; }
  .hero {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: #0d0b09;
    aspect-ratio: 4 / 3;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .nav-shot {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: rgba(20, 16, 12, 0.72);
    color: white;
    font-size: 20px;
    line-height: 1;
  }
  .nav-shot.prev { left: 10px; }
  .nav-shot.next { right: 10px; }
  .nav-shot:hover, .nav-shot:focus-visible { background: rgba(20, 16, 12, 0.92); outline: 2px solid var(--amber); }
  .count-pill {
    position: absolute;
    left: 10px;
    bottom: 10px;
    background: rgba(20, 16, 12, 0.78);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .meta { padding: 14px 14px 8px; }
  .meta h2 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .meta p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 14px 14px;
    scroll-snap-type: x mandatory;
  }
  .strip button {
    flex: 0 0 auto;
    width: 72px;
    height: 54px;
    padding: 0;
    border-radius: 8px;
    border: 2px solid transparent;
    background: #0d0b09;
    scroll-snap-align: start;
    overflow: hidden;
  }
  .strip button[aria-current="true"] { border-color: var(--amber); }
  .strip img { width: 100%; height: 100%; object-fit: cover; }
  .strip button:focus-visible { outline: 2px solid var(--amber-2); outline-offset: 2px; }

  .viewer {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #100e0c;
    display: none;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 16px 16px 12px;
  }
  .viewer.open { display: grid; }
  .viewer-bar, .viewer-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .viewer-bar h2 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
  }
  .viewer-bar p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .icon-btn, .text-btn {
    border: 1px solid var(--line);
    background: var(--card-2);
    border-radius: 999px;
    color: var(--ink);
  }
  .icon-btn {
    width: 42px;
    height: 42px;
    font-size: 22px;
    line-height: 1;
  }
  .text-btn { padding: 8px 14px; font-size: 14px; }
  .icon-btn:hover, .text-btn:hover, .icon-btn:focus-visible, .text-btn:focus-visible {
    border-color: var(--amber);
    outline: none;
  }
  .stage {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin: 8px 0 12px;
  }
  .stage img {
    width: auto;
    height: auto;
    max-width: min(1080px, calc(100% - 96px));
    max-height: 70vh;
    object-fit: contain;
    border-radius: 12px;
    background: #0d0b09;
  }
  .stage .nav-shot { position: absolute; top: 50%; }
  .viewer-foot { align-items: end; }
  .viewer .strip { padding: 0; flex: 1; }
  .keys { color: var(--faint); font-size: 12px; white-space: nowrap; }

  @media (max-width: 980px) {
    .dish, .dish.wide { grid-column: span 6; }
  }
  @media (max-width: 680px) {
    .dish, .dish.wide { grid-column: span 12; }
    .stage img { max-width: 100%; max-height: 58vh; }
    .stage .nav-shot { display: none; }
    .keys { display: none; }
    .viewer-bar { align-items: start; }
    .viewer-bar h2 { font-size: 22px; }
    .viewer-bar .text-btn { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div>
          <p class="eyebrow">Brew club</p>
          <h1>Moon Dog</h1>
          <p class="lede">Every plate from tonight’s backup, with the extra angles of the same dish kept in one stack.</p>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <nav class="jump" id="jump" aria-label="Dishes"></nav>
    </header>
    <main class="board" id="board"></main>
  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <div class="viewer-bar">
      <div>
        <h2 id="viewer-title"></h2>
        <p id="viewer-count"></p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="text-btn" id="prev-dish" type="button">Previous dish</button>
        <button class="text-btn" id="next-dish" type="button">Next dish</button>
        <button class="icon-btn" id="close" type="button" aria-label="Close">×</button>
      </div>
    </div>
    <div class="stage">
      <button class="nav-shot prev" id="view-prev" type="button" aria-label="Previous photo">‹</button>
      <img id="view-img" alt="">
      <button class="nav-shot next" id="view-next" type="button" aria-label="Next photo">›</button>
    </div>
    <div class="viewer-foot">
      <div class="strip" id="view-strip"></div>
      <div class="keys">← → photos · shift ← → dishes · esc closes</div>
    </div>
  </div>

<script>
const dishes = [
  {
    id: "antipasto",
    name: "Antipasto board",
    note: "Focaccia, crackers, prosciutto, salami, olives and hummus.",
    wide: true,
    shots: ["IMG_1842", "IMG_1783", "IMG_1784", "IMG_1822", "IMG_1823", "IMG_1843"]
  },
  {
    id: "paddle",
    name: "Mixed fry paddle",
    note: "Prawns, chicken, flatbread, chips, slaw and three sauces.",
    wide: true,
    shots: ["IMG_1809", "IMG_1810", "IMG_1811", "IMG_1812", "IMG_1813", "IMG_1814", "IMG_1838", "IMG_1839"]
  },
  {
    id: "steak",
    name: "Steak, chips and gravy",
    note: "The same steak plate, inside and out on the deck.",
    shots: ["IMG_1806", "IMG_1807", "IMG_1821", "IMG_1799", "IMG_1800", "IMG_1801", "IMG_1834"]
  },
  {
    id: "ribs",
    name: "Ribs and slaw",
    note: "Ribs, slaw and chips, shot from both seats.",
    shots: ["IMG_1802", "IMG_1803", "IMG_1804", "IMG_1805", "IMG_1824", "IMG_1825", "IMG_1826", "IMG_1829"]
  },
  {
    id: "pasta",
    name: "Tomato fettuccine",
    note: "Rocket, parmesan, and the glass of red beside it.",
    shots: ["IMG_1830", "IMG_1841", "IMG_1815", "IMG_1816", "IMG_1817", "IMG_1819", "IMG_1820"]
  },
  {
    id: "burger",
    name: "Burger and chips",
    note: "The bun, lettuce and chips on the green-rim plate.",
    shots: ["IMG_1789", "IMG_1790", "IMG_1791", "IMG_1796", "IMG_1833"]
  },
  {
    id: "chicken",
    name: "Fried chicken",
    note: "Crispy chicken, slaw and the orange sauce.",
    shots: ["IMG_1785", "IMG_1786", "IMG_1793", "IMG_1840"]
  },
  {
    id: "fries",
    name: "Loaded chips",
    note: "Chips in the paper boat, with the green onion on top.",
    shots: ["IMG_1797", "IMG_1798", "IMG_1835"]
  },
  {
    id: "hummus",
    name: "Hummus and flatbread",
    note: "The full plate of hummus, separate from the board.",
    shots: ["IMG_1792"]
  },
  {
    id: "bites",
    name: "Sesame bites",
    note: "Golden sesame pieces on rocket and microgreens.",
    shots: ["IMG_1794", "IMG_1831"]
  },
  {
    id: "loaf",
    name: "Sesame loaf",
    note: "Four slices on the newspaper liner, with the dipping sauce.",
    shots: ["IMG_1787", "IMG_1788", "IMG_1836", "IMG_1837"]
  },
  {
    id: "pannacotta",
    name: "Panna cotta",
    note: "Berries, walnuts and honey. A couple of frames include the cocktail.",
    wide: true,
    shots: ["IMG_1845", "IMG_1832", "IMG_1827", "IMG_1828", "IMG_1844"]
  }
];

const full = (id) => `img/${id}.jpg`;
const thumb = (id) => `thumb/${id}.jpg`;
const board = document.getElementById("board");
const viewer = document.getElementById("viewer");
const indexes = Object.fromEntries(dishes.map((d) => [d.id, 0]));
let open = null;
let lastFocus = null;
let touchX = null;

function shotCount(dish) { return dish.shots.length; }

function renderStats() {
  const photos = dishes.reduce((n, d) => n + d.shots.length, 0);
  document.getElementById("stats").innerHTML =
    `<div><strong>${dishes.length}</strong>dishes</div><div><strong>${photos}</strong>photos</div>`;
}

function renderJump() {
  const nav = document.getElementById("jump");
  nav.replaceChildren();
  for (const dish of dishes) {
    const a = document.createElement("a");
    a.href = `#${dish.id}`;
    a.textContent = dish.name;
    nav.appendChild(a);
  }
}

function renderBoard() {
  board.replaceChildren();
  for (const dish of dishes) {
    const card = document.createElement("article");
    card.className = "dish" + (dish.wide ? " wide" : "");
    card.id = dish.id;

    const frame = document.createElement("div");
    frame.className = "frame";

    const hero = document.createElement("button");
    hero.className = "hero";
    hero.type = "button";
    hero.dataset.open = dish.id;
    const img = document.createElement("img");
    img.dataset.hero = dish.id;
    img.alt = "";
    hero.appendChild(img);
    frame.appendChild(hero);

    if (shotCount(dish) > 1) {
      for (const dir of ["prev", "next"]) {
        const b = document.createElement("button");
        b.className = `nav-shot ${dir}`;
        b.type = "button";
        b.dataset.step = dir === "next" ? "1" : "-1";
        b.dataset.dish = dish.id;
        b.setAttribute("aria-label", dir === "next" ? "Next photo of this dish" : "Previous photo of this dish");
        b.textContent = dir === "next" ? "›" : "‹";
        frame.appendChild(b);
      }
    }

    const pill = document.createElement("div");
    pill.className = "count-pill";
    pill.dataset.pill = dish.id;
    frame.appendChild(pill);

    const meta = document.createElement("div");
    meta.className = "meta";
    const h2 = document.createElement("h2");
    h2.textContent = dish.name;
    const p = document.createElement("p");
    p.textContent = dish.note;
    meta.append(h2, p);

    const strip = document.createElement("div");
    strip.className = "strip";
    strip.setAttribute("role", "list");
    dish.shots.forEach((shot, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.pick = dish.id;
      b.dataset.index = String(i);
      b.setAttribute("role", "listitem");
      const t = document.createElement("img");
      t.src = thumb(shot);
      t.alt = `${dish.name}, photo ${i + 1} of ${dish.shots.length}`;
      b.appendChild(t);
      strip.appendChild(b);
    });

    card.append(frame, meta, strip);
    board.appendChild(card);
    paintCard(dish.id);
  }
}

function paintCard(id) {
  const dish = dishes.find((d) => d.id === id);
  const i = indexes[id];
  const img = board.querySelector(`img[data-hero="${id}"]`);
  img.src = full(dish.shots[i]);
  img.alt = `${dish.name}, photo ${i + 1} of ${dish.shots.length}. Open larger.`;
  const pill = board.querySelector(`[data-pill="${id}"]`);
  pill.textContent = dish.shots.length === 1 ? "1 photo" : `${i + 1} / ${dish.shots.length}`;
  board.querySelectorAll(`button[data-pick="${id}"]`).forEach((b) => {
    b.setAttribute("aria-current", Number(b.dataset.index) === i ? "true" : "false");
  });
}

function stepCard(id, delta) {
  const dish = dishes.find((d) => d.id === id);
  const n = dish.shots.length;
  indexes[id] = (indexes[id] + delta + n) % n;
  paintCard(id);
  if (open && open.id === id) paintViewer();
}

function openViewer(id, index) {
  const dish = dishes.find((d) => d.id === id);
  indexes[id] = (index + dish.shots.length) % dish.shots.length;
  open = dish;
  lastFocus = document.activeElement;
  viewer.hidden = false;
  viewer.classList.add("open");
  document.body.style.overflow = "hidden";
  paintViewer();
  paintCard(id);
  history.replaceState(null, "", `#view/${id}/${indexes[id]}`);
  document.getElementById("close").focus();
}

function closeViewer() {
  open = null;
  viewer.classList.remove("open");
  viewer.hidden = true;
  document.body.style.overflow = "";
  if (location.hash.startsWith("#view/")) {
    history.replaceState(null, "", location.pathname + location.search);
  }
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function paintViewer() {
  const i = indexes[open.id];
  const shot = open.shots[i];
  document.getElementById("viewer-title").textContent = open.name;
  document.getElementById("viewer-count").textContent =
    `Photo ${i + 1} of ${open.shots.length} · ${open.note}`;
  const img = document.getElementById("view-img");
  img.src = full(shot);
  img.alt = `${open.name}, photo ${i + 1} of ${open.shots.length}`;
  const strip = document.getElementById("view-strip");
  strip.replaceChildren();
  let currentThumb = null;
  open.shots.forEach((s, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.viewIndex = String(n);
    b.setAttribute("aria-label", `Show photo ${n + 1}`);
    b.setAttribute("aria-current", n === i ? "true" : "false");
    const t = document.createElement("img");
    t.src = thumb(s);
    t.alt = "";
    b.appendChild(t);
    strip.appendChild(b);
    if (n === i) currentThumb = b;
  });
  if (currentThumb) {
    const left = currentThumb.offsetLeft - (strip.clientWidth - currentThumb.clientWidth) / 2;
    strip.scrollTo({ left: Math.max(0, left) });
  }
  history.replaceState(null, "", `#view/${open.id}/${i}`);
}

function stepDish(delta) {
  if (!open) return;
  const at = dishes.findIndex((d) => d.id === open.id);
  const next = dishes[(at + delta + dishes.length) % dishes.length];
  openViewer(next.id, indexes[next.id]);
}

function readHash() {
  const m = location.hash.match(/^#view\/([a-z]+)\/(\d+)$/);
  if (!m) return;
  const dish = dishes.find((d) => d.id === m[1]);
  if (!dish) return;
  openViewer(dish.id, Number(m[2]));
}

board.addEventListener("click", (event) => {
  const openBtn = event.target.closest("[data-open]");
  const stepBtn = event.target.closest("[data-step]");
  const pickBtn = event.target.closest("[data-pick]");
  if (stepBtn) {
    event.stopPropagation();
    stepCard(stepBtn.dataset.dish, Number(stepBtn.dataset.step));
    return;
  }
  if (pickBtn) {
    const id = pickBtn.dataset.pick;
    indexes[id] = Number(pickBtn.dataset.index);
    paintCard(id);
    openViewer(id, indexes[id]);
    return;
  }
  if (openBtn) openViewer(openBtn.dataset.open, indexes[openBtn.dataset.open]);
});

document.getElementById("close").addEventListener("click", closeViewer);
document.getElementById("view-prev").addEventListener("click", () => stepCard(open.id, -1));
document.getElementById("view-next").addEventListener("click", () => stepCard(open.id, 1));
document.getElementById("prev-dish").addEventListener("click", () => stepDish(-1));
document.getElementById("next-dish").addEventListener("click", () => stepDish(1));
document.getElementById("view-strip").addEventListener("click", (event) => {
  const b = event.target.closest("[data-view-index]");
  if (!b || !open) return;
  indexes[open.id] = Number(b.dataset.viewIndex);
  paintCard(open.id);
  paintViewer();
  history.replaceState(null, "", `#view/${open.id}/${indexes[open.id]}`);
});

viewer.addEventListener("click", (event) => {
  if (event.target === viewer) closeViewer();
});

const stageImg = document.getElementById("view-img");
stageImg.addEventListener("touchstart", (event) => {
  touchX = event.changedTouches[0].clientX;
}, { passive: true });
stageImg.addEventListener("touchend", (event) => {
  if (touchX == null || !open) return;
  const dx = event.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) stepCard(open.id, dx < 0 ? 1 : -1);
  touchX = null;
}, { passive: true });

document.addEventListener("keydown", (event) => {
  if (!open) return;
  if (event.key === "Escape") {
    event.preventDefault();
    closeViewer();
  } else if (event.key === "ArrowRight" && event.shiftKey) {
    event.preventDefault();
    stepDish(1);
  } else if (event.key === "ArrowLeft" && event.shiftKey) {
    event.preventDefault();
    stepDish(-1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    stepCard(open.id, 1);
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    stepCard(open.id, -1);
  }
});

renderStats();
renderJump();
renderBoard();
readHash();
window.addEventListener("hashchange", () => {
  if (location.hash.startsWith("#view/")) readHash();
  else if (open) closeViewer();
});
</script>
</body>
</html>
